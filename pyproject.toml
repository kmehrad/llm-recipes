[project]
name = "llm-recipes"
version = "0.1.0"
description = "Educational implementations of modern LLM architectures from the ground up."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Kamron M" },
]
dependencies = [
    "huggingface-hub>=0.33.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
    "numpy>=2.0.0",
    "safetensors>=0.5.0",
    "tokenizers>=0.21.0",
    "torch>=2.7.0",
    "tqdm>=4.67.0",
    "transformers>=4.53.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
